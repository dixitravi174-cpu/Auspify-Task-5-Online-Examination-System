<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examination Results & Score Report</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="card p-5 shadow-sm text-center border-0" style="max-width: 500px; width: 100%;">
        <h2 class="text-primary mb-2">Examination Report</h2>
        <p class="text-muted mb-4">Candidate: <strong>{{ username }}</strong></p>
        
        <div class="display-4 fw-bold text-dark mb-2">{{ score }} / {{ total }}</div>
        <h4 class="text-muted mb-3">Percentage: {{ "%.2f"|format(percentage) }}%</h4>
        
        <div class="mb-4">
            <span class="badge bg-{{ 'success' if status == 'Pass' else 'danger' }} fs-5 px-4 py-2">
                Status: {{ status }}
            </span>
        </div>
        
        <a href="/" class="btn btn-primary w-100 py-2">Back to Dashboard</a>
    </div>
</body>
</html>
