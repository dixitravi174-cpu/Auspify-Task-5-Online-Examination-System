<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Examination Session</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Online Examination in Progress</span>
            <span class="text-white">Candidate: <strong>{{ username }}</strong></span>
        </div>
    </nav>
    <div class="container pb-5" style="max-width: 800px;">
        <form action="/submit_exam" method="POST">
            {% for q in questions %}
            <div class="card p-4 mb-3 shadow-sm border-0">
                <h5 class="text-primary mb-3">Q{{ loop.index }}. {{ q['question'] }}</h5>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="q_{{ q['id'] }}" value="{{ q['option_a'] }}" required>
                    <label class="form-check-label">{{ q['option_a'] }}</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="q_{{ q['id'] }}" value="{{ q['option_b'] }}">
                    <label class="form-check-label">{{ q['option_b'] }}</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="q_{{ q['id'] }}" value="{{ q['option_c'] }}">
                    <label class="form-check-label">{{ q['option_c'] }}</label>
                </div>
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="q_{{ q['id'] }}" value="{{ q['option_d'] }}">
                    <label class="form-check-label">{{ q['option_d'] }}</label>
                </div>
            </div>
            {% endfor %}
            <div class="text-end">
                <button type="submit" class="btn btn-success btn-lg px-5 py-2 shadow-sm">Submit Examination</button>
            </div>
        </form>
    </div>
</body>
</html>
